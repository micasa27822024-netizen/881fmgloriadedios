<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 88.1 FM - Gloria de Dios</title>
  
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    /* Fondo por defecto para celulares */
    .background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('fondo.jpg') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    /* Fondo para PC y pantallas anchas */
    @media (min-width: 768px) {
      .background-container {
        background-image: url('fondo-pc.jpg');
      }
    }

    /* Capa oscura suave */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      z-index: 1;
    }

    /* Contenido principal */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Barra Superior */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Badge EN VIVO */
    .live-badge {
      background: rgba(220, 38, 38, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(255, 255, 255, 0.7);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn-top {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      height: 42px;
      padding: 0 14px;
      border-radius: 21px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      gap: 6px;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-top:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.35);
    }

    /* Reproductor en la zona inferior */
    .player-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: auto;
      margin-bottom: 20px;
      gap: 15px;
    }

    /* Ecualizador animado */
    .equalizer {
      display: flex;
      align-items: flex-end;
      height: 20px;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .equalizer.active {
      opacity: 1;
    }

    .bar {
      width: 4px;
      height: 100%;
      background: #f59e0b;
      border-radius: 2px;
      animation: bounce 1.2s infinite ease-in-out alternate;
    }

    .bar:nth-child(1) { animation-delay: 0.1s; }
    .bar:nth-child(2) { animation-delay: 0.4s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.5s; }

    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 22px; }
    }

    .btn-play {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 4px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
      color: white;
      font-size: 2.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      padding-left: 5px;
    }

    .btn-play.playing {
      padding-left: 0;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    }

    .btn-play:hover {
      transform: scale(1.08);
    }

    /* Control de Volumen */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.4);
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    /* Sección Inferior: Mensajes y Redes Sociales */
    .footer-section {
      width: 100%;
      max-width: 600px;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      padding: 15px 10px 20px 10px;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .footer-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .footer-subtitle {
      font-size: 0.8rem;
      color: #e5e7eb;
      margin-bottom: 12px;
    }

    .social-buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
    }

    .social-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.4rem;
      text-decoration: none;
      transition: transform 0.2s, filter 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .social-btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.15);
    }

    .facebook { background-color: #1877f2; }
    .whatsapp { background-color: #25d366; }
    .youtube  { background-color: #ff0000; }
    .oracion  { background-color: #f59e0b; }
  </style>
</head>
<body>

  <div class="background-container">
    <div class="overlay"></div>

    <div class="content">
      <!-- Barra Superior -->
      <div class="top-bar">
        <div class="live-badge">
          <div class="pulse-dot"></div>
          <span>En Vivo</span>
        </div>

        <div class="top-actions">
          <a href="https://www.appcreator24.com/app4188732-4ujkte" target="_blank" class="btn-top" title="Descargar App">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <span>App</span>
          </a>

          <button class="btn-top" onclick="shareWebsite()" title="Compartir">
            <i class="fa-solid fa-share-nodes"></i>
          </button>
        </div>
      </div>

      <!-- Contenedor del Reproductor -->
      <div class="player-container">
        <!-- Ecualizador de Audio -->
        <div class="equalizer" id="equalizer">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>

        <!-- Botón Play/Pause -->
        <button class="btn-play" id="playBtn" onclick="toggleAudio()">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>

        <!-- Control de Volumen -->
        <div class="volume-container">
          <i class="fa-solid fa-volume-high" id="volIcon" onclick="toggleMute()" style="cursor:pointer; font-size: 0.9rem;"></i>
          <input type="range" class="volume-slider" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
        </div>
      </div>

      <audio id="radioStream" src="https://stream.zeno.fm/ggq0ed8yus8uv.mp3" type="audio/mpeg" preload="none"></audio>

      <!-- Pie de página con redes -->
      <div class="footer-section">
        <div class="footer-title">¡Mándanos un mensaje!</div>
        <div class="footer-subtitle">Y seguinos en las redes sociales</div>

        <div class="social-buttons">
          <a href="https://www.facebook.com/people/881-FM-Gloria-de-Dios/61582872864718/" target="_blank" class="social-btn facebook" title="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
          </a>
          
          <a href="https://wa.me/5493416948385?text=Hola%20Radio%2088.1%20FM,%20quiero%20mandar%20un%20saludo" target="_blank" class="social-btn whatsapp" title="WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
          </a>

          <a href="https://wa.me/5493416948385?text=Hola%20Radio%2088.1%20FM,%20quisiera%20dejar%20una%20petición%20de%20oración:" target="_blank" class="social-btn oracion" title="Pedir Oración">
            <i class="fa-solid fa-hands-praying"></i>
          </a>

          <a href="https://www.youtube.com/@iglesiamontedesantidad6232" target="_blank" class="social-btn youtube" title="YouTube">
            <i class="fa-brands fa-youtube"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const streamUrl = "https://stream.zeno.fm/ggq0ed8yus8uv.mp3";
    const shareUrl = "https://www.appcreator24.com/app4188732-4ujkte";
    const audio = document.getElementById('radioStream');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const equalizer = document.getElementById('equalizer');
    const volSlider = document.getElementById('volSlider');
    const volIcon = document.getElementById('volIcon');

    let lastVolume = 1;

    function setupMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Radio 88.1 FM',
          artist: 'Gloria de Dios',
          album: 'En Vivo',
          artwork: [
            { src: 'fondo.jpg', sizes: '512x512', type: 'image/jpeg' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => { if (audio.paused) toggleAudio(); });
        navigator.mediaSession.setActionHandler('pause', () => { if (!audio.paused) toggleAudio(); });
        navigator.mediaSession.setActionHandler('stop', () => { if (!audio.paused) toggleAudio(); });
      }
    }

    function toggleAudio() {
      if (audio.paused) {
        playIcon.className = 'fa-solid fa-spinner fa-spin';

        audio.src = streamUrl + "?t=" + new Date().getTime();
        audio.play().then(() => {
          playBtn.classList.add('playing');
          playIcon.className = 'fa-solid fa-pause';
          equalizer.classList.add('active');

          setupMediaSession();
          if ('mediaSession' in navigator) {
            navigator.mediaSession.playbackState = 'playing';
          }
        }).catch(error => {
          console.error("Error al reproducir audio:", error);
          playIcon.className = 'fa-solid fa-play';
          playBtn.classList.remove('playing');
          equalizer.classList.remove('active');
          alert("No se pudo conectar con el servidor de la radio.");
        });
      } else {
        audio.pause();
        audio.removeAttribute('src');
        playBtn.classList.remove('playing');
        playIcon.className = 'fa-solid fa-play';
        equalizer.classList.remove('active');

        if ('mediaSession' in navigator) {
          navigator.mediaSession.playbackState = 'paused';
        }
      }
    }

    function setVolume(val) {
      audio.volume = val;
      if (val == 0) {
        volIcon.className = 'fa-solid fa-volume-xmark';
      } else if (val < 0.5) {
        volIcon.className = 'fa-solid fa-volume-low';
      } else {
        volIcon.className = 'fa-solid fa-volume-high';
      }
    }

    function toggleMute() {
      if (audio.volume > 0) {
        lastVolume = audio.volume;
        volSlider.value = 0;
        setVolume(0);
      } else {
        volSlider.value = lastVolume || 1;
        setVolume(volSlider.value);
      }
    }

    function shareWebsite() {
      if (navigator.share) {
        navigator.share({
          title: 'Radio 88.1 FM - Gloria de Dios',
          text: '¡Escuchá la radio en vivo!',
          url: shareUrl
        }).catch((error) => console.log('Error al compartir:', error));
      } else {
        navigator.clipboard.writeText(shareUrl);
        alert('¡Enlace copiado al portapapeles!');
      }
    }
  </script>
</body>
</html>
