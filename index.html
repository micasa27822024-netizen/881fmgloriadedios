<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 88.1 FM - Gloria de Dios</title>
  
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    /* Fondo por defecto para celulares */
    .background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('fondo.jpg') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    @media (min-width: 768px) {
      .background-container {
        background-image: url('fondo-pc.jpg');
      }
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Barra Superior */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-badge {
      background: rgba(220, 38, 38, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(255, 255, 255, 0.7);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .btn-top {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      height: 40px;
      padding: 0 12px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      gap: 6px;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-top:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.35);
    }

    /* Tarjeta de Versículo Rotativo */
    .verse-card {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 10px 16px;
      max-width: 90%;
      text-align: center;
      margin-top: 15px;
      transition: opacity 0.5s ease-in-out;
    }

    .verse-text {
      font-size: 0.85rem;
      font-style: italic;
      color: #f3f4f6;
    }

    .verse-ref {
      font-size: 0.75rem;
      font-weight: 700;
      color: #f59e0b;
      margin-top: 3px;
    }

    /* Reproductor */
    .player-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: auto;
      margin-bottom: 15px;
      gap: 12px;
    }

    .btn-play {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 4px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
      color: white;
      font-size: 2.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      padding-left: 5px;
    }

    .btn-play.playing {
      padding-left: 0;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 75px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.4);
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    /* Pie de Página */
    .footer-section {
      width: 100%;
      max-width: 600px;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      padding: 15px 10px 20px 10px;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .footer-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .footer-subtitle {
      font-size: 0.8rem;
      color: #e5e7eb;
      margin-bottom: 12px;
    }

    .social-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .social-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.3rem;
      text-decoration: none;
      transition: transform 0.2s, filter 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .facebook { background-color: #1877f2; }
    .whatsapp { background-color: #25d366; }
    .oracion  { background-color: #f59e0b; }
    .youtube  { background-color: #ff0000; }

    /* Modal de Programación */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 10;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #121824;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .schedule-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <div class="background-container">
    <div class="overlay"></div>

    <div class="content">
      <!-- Barra Superior -->
      <div class="top-bar">
        <div class="live-badge">
          <div class="pulse-dot"></div>
          <span>En Vivo</span>
        </div>

        <div class="top-actions">
          <!-- Temporizador -->
          <button class="btn-top" onclick="cycleTimer()" id="timerBtn" title="Temporizador de apagado">
            <i class="fa-solid fa-clock"></i>
            <span id="timerLabel">Off</span>
          </button>

          <!-- Horarios -->
          <button class="btn-top" onclick="toggleModal(true)" title="Programación">
            <i class="fa-solid fa-calendar-days"></i>
          </button>

          <!-- App -->
          <a href="https://www.appcreator24.com/app4188732-4ujkte" target="_blank" class="btn-top" title="Descargar App">
            <i class="fa-solid fa-mobile-screen-button"></i>
          </a>

          <!-- Compartir -->
          <button class="btn-top" onclick="shareWebsite()" title="Compartir">
            <i class="fa-solid fa-share-nodes"></i>
          </button>
        </div>
      </div>

      <!-- Versículo Bíblico Rotativo -->
      <div class="verse-card">
        <div class="verse-text" id="verseText">"El Señor es mi pastor; nada me faltará."</div>
        <div class="verse-ref" id="verseRef">Salmos 23:1</div>
      </div>

      <!-- Reproductor -->
      <div class="player-container">
        <button class="btn-play" id="playBtn" onclick="toggleAudio()">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>

        <div class="volume-container">
          <i class="fa-solid fa-volume-high" id="volIcon" onclick="toggleMute()" style="cursor:pointer; font-size: 0.9rem;"></i>
          <input type="range" class="volume-slider" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
        </div>
      </div>

      <audio id="radioStream" src="https://stream.zeno.fm/ggq0ed8yus8uv.mp3" type="audio/mpeg" preload="none"></audio>

      <!-- Pie de página -->
      <div class="footer-section">
        <div class="footer-title">¡Mándanos un mensaje!</div>
        <div class="footer-subtitle">Y seguinos en las redes sociales</div>

        <div class="social-buttons">
          <a href="https://www.facebook.com/ptordaniel" target="_blank" class="social-btn facebook" title="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
          </a>
          
          <a href="https://wa.me/5493416948385?text=Hola%20Radio%2088.1%20FM,%20quiero%20mandar%20un%20saludo" target="_blank" class="social-btn whatsapp" title="WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
          </a>

          <a href="https://wa.me/5493416948385?text=Hola%20Radio%2088.1%20FM,%20quisiera%20dejar%20una%20petición%20de%20oración:" target="_blank" class="social-btn oracion" title="Pedir Oración">
            <i class="fa-solid fa-hands-praying"></i>
          </a>

          <a href="https://www.youtube.com/@iglesiamontedesantidad6232" target="_blank" class="social-btn youtube" title="YouTube">
            <i class="fa-brands fa-youtube"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Programación -->
  <div class="modal" id="scheduleModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1.1rem; color: #f59e0b;"><i class="fa-solid fa-radio"></i> Programación</h3>
        <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 1.2rem;" onclick="toggleModal(false)"></i>
      </div>
      <div class="schedule-item">
        <span>Mañanas de Bendición</span>
        <strong style="color: #f59e0b;">08:00 - 12:00</strong>
      </div>
      <div class="schedule-item">
        <span>Alabanzas en Vivo</span>
        <strong style="color: #f59e0b;">12:00 - 16:00</strong>
      </div>
      <div class="schedule-item">
        <span>Palabra y Esperanza</span>
        <strong style="color: #f59e0b;">16:00 - 20:00</strong>
      </div>
      <div class="schedule-item">
        <span>Noche de Adoración</span>
        <strong style="color: #f59e0b;">20:00 - 00:00</strong>
      </div>
    </div>
  </div>

  <script>
    const streamUrl = "https://stream.zeno.fm/ggq0ed8yus8uv.mp3";
    const shareUrl = "https://www.appcreator24.com/app4188732-4ujkte";
    const audio = document.getElementById('radioStream');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const volSlider = document.getElementById('volSlider');
    const volIcon = document.getElementById('volIcon');

    let timerTimeout = null;
    let timerMinutes = 0;

    // Versículos rotativos
    const verses = [
      { text: '"El Señor es mi pastor; nada me faltará."', ref: "Salmos 23:1" },
      { text: '"Todo lo puedo en Cristo que me fortalece."', ref: "Filipenses 4:13" },
      { text: '"Porque yo sé los pensamientos que tengo acerca de vosotros..."', ref: "Jeremías 29:11" },
      { text: '"Clama a mí, y yo te responderé, y te enseñaré cosas grandes..."', ref: "Jeremías 33:3" }
    ];
    let verseIndex = 0;

    setInterval(() => {
      verseIndex = (verseIndex + 1) % verses.length;
      document.getElementById('verseText').innerText = verses[verseIndex].text;
      document.getElementById('verseRef').innerText = verses[verseIndex].ref;
    }, 10000);

    function setupMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Radio 88.1 FM',
          artist: 'Gloria de Dios',
          album: 'En Vivo',
          artwork: [{ src: 'fondo.jpg', sizes: '512x512', type: 'image/jpeg' }]
        });

        navigator.mediaSession.setActionHandler('play', () => { if (audio.paused) toggleAudio(); });
        navigator.mediaSession.setActionHandler('pause', () => { if (!audio.paused) toggleAudio(); });
      }
    }

    function toggleAudio() {
      if (audio.paused) {
        playIcon.className = 'fa-solid fa-spinner fa-spin';
        audio.src = streamUrl + "?t=" + new Date().getTime();
        audio.play().then(() => {
          playBtn.classList.add('playing');
          playIcon.className = 'fa-solid fa-pause';
          setupMediaSession();
        }).catch(error => {
          playIcon.className = 'fa-solid fa-play';
          playBtn.classList.remove('playing');
          alert("No se pudo conectar con el servidor.");
        });
      } else {
        audio.pause();
        audio.removeAttribute('src');
        playBtn.classList.remove('playing');
        playIcon.className = 'fa-solid fa-play';
      }
    }

    /* Temporizador de apagado */
    function cycleTimer() {
      if (timerMinutes === 0) timerMinutes = 15;
      else if (timerMinutes === 15) timerMinutes = 30;
      else if (timerMinutes === 30) timerMinutes = 60;
      else timerMinutes = 0;

      clearTimeout(timerTimeout);
      const label = document.getElementById('timerLabel');

      if (timerMinutes > 0) {
        label.innerText = timerMinutes + 'm';
        timerTimeout = setTimeout(() => {
          if (!audio.paused) toggleAudio();
          timerMinutes = 0;
          label.innerText = 'Off';
        }, timerMinutes * 60 * 1000);
      } else {
        label.innerText = 'Off';
      }
    }

    /* Controles de volumen */
    function setVolume(val) {
      audio.volume = val;
      volIcon.className = val == 0 ? 'fa-solid fa-volume-xmark' : (val < 0.5 ? 'fa-solid fa-volume-low' : 'fa-solid fa-volume-high');
    }

    function toggleMute() {
      if (audio.volume > 0) {
        volSlider.value = 0;
        setVolume(0);
      } else {
        volSlider.value = 1;
        setVolume(1);
      }
    }

    function toggleModal(show) {
      document.getElementById('scheduleModal').style.display = show ? 'flex' : 'none';
    }

    function shareWebsite() {
      if (navigator.share) {
        navigator.share({ title: 'Radio 88.1 FM', text: '¡Escuchá la radio en vivo!', url: shareUrl });
      } else {
        navigator.clipboard.writeText(shareUrl);
        alert('¡Enlace copiado!');
      }
    }
  </script>
</body>
</html>
